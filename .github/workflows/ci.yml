name: Build check

on:
  push:
    branches: [main]
    paths-ignore: ["src/content/news/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the news script compiles
        run: python -m py_compile scripts/generate_news.py
